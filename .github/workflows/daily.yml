name: arxiv-daily-wechat
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-delivery
  cancel-in-progress: false
env:
  PAGE_BASE_URL: https://way-wind.github.io/my-arxiv-daily-push
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - run: python main.py --prepare-only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_ALLOWED_HOSTS: ${{ vars.DEEPSEEK_ALLOWED_HOSTS }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          AI_MAX_PAPERS: ${{ vars.AI_MAX_PAPERS }}
          AI_MAX_REQUESTS: ${{ vars.AI_MAX_REQUESTS }}
          AI_MAX_SECONDS: ${{ vars.AI_MAX_SECONDS }}
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES }}
          ARXIV_HOURS_BACK: ${{ vars.ARXIV_HOURS_BACK }}
          ARXIV_MAX_PAPERS: ${{ vars.ARXIV_MAX_PAPERS }}
          WECHAT_MODE: ${{ vars.WECHAT_MODE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared
          retention-days: 7
          path: |
            pages/
            page-data/
            pending.json
            last_pushed.json

  persist-prepared:
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared
      - id: persist
        run: python persist.py
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: persist-prepared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: pages/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checkpoint: ${{ steps.checkpoint.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: "pip install --require-hashes --only-binary=:all: -r requirements.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared
      # On reruns, require the checkpoint; never silently discard confirmed sends.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ github.run_attempt > 1 }}
        with:
          name: delivery-checkpoint
      - id: deliver
        run: python main.py --notify-pending
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
      - id: checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure') }}
        with:
          overwrite: true
          name: delivery-checkpoint
          retention-days: 7
          path: |
            pages/
            page-data/
            pending.json
            last_pushed.json

  persist-checkpoint:
    needs: [notify, persist-prepared]
    if: ${{ always() && needs.notify.outputs.checkpoint == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.persist-prepared.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: delivery-checkpoint
      - id: persist
        run: python persist.py
        env:
          GH_TOKEN: ${{ github.token }}
